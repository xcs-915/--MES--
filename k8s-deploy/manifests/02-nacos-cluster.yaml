# [架构说明] 当前为单体模式: 后端 tns-mes-server (NodePort 31180) 统一提供前端页面与 API, 不再使用 Gateway/微服务/独立前端 Pod
# ==============================================================================
# 02-nacos-cluster.yaml
# TNS-MES Phase 3 高可用部署 - Nacos 集群 (3 副本)
# 说明: Nacos 2.2.3 集群模式, 使用外部 SQL Server 2019 存储配置数据
#       3 副本保证高可用, PDB 确保至少 2 个节点始终可用
# ==============================================================================

---
# ConfigMap: Nacos 自定义配置文件
# 用途: 配置 Nacos 使用外部 SQL Server 存储集群配置, 替代默认内嵌 derby
apiVersion: v1
kind: ConfigMap
metadata:
  name: nacos-config
  namespace: tns-mes-middleware
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: tns-mes
data:
  custom.properties: |
    # Nacos 使用外部 SQL Server 2019 存储配置数据
    spring.datasource.platform=mssql
    db.num=1
    db.url.0=jdbc:sqlserver://10.30.10.141:1433;databaseName=nacos_config;encrypt=false;trustServerCertificate=true;SelectMethod=cursor
    db.user.0=tns_mes_user
    db.password.0=${NACOS_DB_PASSWORD}
    # 连接池配置
    db.pool.config.connectionTimeout=30000
    db.pool.config.maxLifetime=60000
    db.pool.config.maximumPoolSize=20
    db.pool.config.minimumIdle=5
    # 开启双写与权限校验 (生产环境安全配置)
    nacos.core.auth.enabled=true
    nacos.core.auth.server.identity.key=nacos
    nacos.core.auth.server.identity.value=tns-mes-nacos-security
    nacos.core.auth.plugin.nacos.token.secret.key=SecretKey0123456789012345678901234567890123456789012345678901234567890
    # 开启 Nacos 集群指标暴露
    management.endpoints.web.exposure.include=*

---
# Headless Service: Nacos 集群内部成员发现
# 用途: 为每个 Pod 提供稳定的 DNS 名称 (nacos-0.nacos-headless, nacos-1, nacos-2)
#       Raft 协议 (7848) 依赖此服务进行集群选举
apiVersion: v1
kind: Service
metadata:
  name: nacos-headless
  namespace: tns-mes-middleware
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: tns-mes
    app.kubernetes.io/component: cluster-discovery
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      protocol: TCP
    - name: grpc-client
      port: 9848
      targetPort: 9848
      protocol: TCP
    - name: raft
      port: 7848
      targetPort: 7848
      protocol: TCP

---
# Service: Nacos 客户端访问入口 (ClusterIP)
# 用途: 微服务通过 nacos-svc.tns-mes-middleware:8848 连接 Nacos
apiVersion: v1
kind: Service
metadata:
  name: nacos-svc
  namespace: tns-mes-middleware
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: tns-mes
    app.kubernetes.io/component: client-access
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      protocol: TCP
    - name: grpc-client
      port: 9848
      targetPort: 9848
      protocol: TCP

---
# StatefulSet: Nacos 集群 (3 副本)
# 说明: 使用 StatefulSet 保证 Pod 有序部署和稳定网络标识
#       集群成员通过 NACOS_SERVERS 环境变量互相发现
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nacos
  namespace: tns-mes-middleware
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: tns-mes
    app.kubernetes.io/component: config-registry
spec:
  serviceName: nacos-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nacos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nacos
        app.kubernetes.io/part-of: tns-mes
        app.kubernetes.io/component: config-registry
    spec:
      # 反亲和: 尽量将 Nacos Pod 调度到不同节点
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - nacos
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nacos
          image: registry.cn-hangzhou.aliyuncs.com/nacos/nacos-server:v2.2.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8848
            - name: grpc-client
              containerPort: 9848
            - name: raft
              containerPort: 7848
          env:
            # 集群模式
            - name: MODE
              value: "cluster"
            # 使用主机名模式, 便于集群成员通过 DNS 互发现
            - name: PREFER_HOST_MODE
              value: "hostname"
            # 集群成员列表 (3 节点)
            - name: NACOS_SERVERS
              value: >-
                nacos-0.nacos-headless.tns-mes-middleware.svc.cluster.local:8848
                nacos-1.nacos-headless.tns-mes-middleware.svc.cluster.local:8848
                nacos-2.nacos-headless.tns-mes-middleware.svc.cluster.local:8848
            # JVM 内存参数 (适配 768Mi limit)
            - name: JVM_XMS
              value: "512m"
            - name: JVM_XMX
              value: "512m"
            - name: JVM_XMN
              value: "128m"
            - name: JVM_MS
              value: "64m"
            - name: JVM_MMS
              value: "128m"
            # 嵌入式数据存储关闭, 使用外部 SQL Server
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: middleware-secrets
                  key: nacos-db-password
            - name: NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: middleware-secrets
                  key: nacos-password
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          # 挂载自定义 SQL Server 数据源配置
          volumeMounts:
            - name: nacos-config-volume
              mountPath: /home/nacos/conf/application.properties
              subPath: custom.properties
            - name: nacos-logs
              mountPath: /home/nacos/logs
          # 就绪探针: Nacos HTTP API 可访问
          readinessProbe:
            httpGet:
              path: /nacos/v1/console/health/readiness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          # 存活探针
          livenessProbe:
            httpGet:
              path: /nacos/v1/console/health/liveness
              port: 8848
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: nacos-config-volume
          configMap:
            name: nacos-config
        # 单节点环境使用 emptyDir; 多节点扩展后替换为 PVC
        - name: nacos-logs
          emptyDir: {}

---
# PodDisruptionBudget: 保证 Nacos 集群至少 2 个节点可用
# 用途: 维护期间 (如节点驱逐) 防止超过 1 个 Pod 同时下线, 保证集群多数派
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nacos-pdb
  namespace: tns-mes-middleware
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: tns-mes
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nacos
