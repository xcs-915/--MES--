# [架构说明] 当前为单体模式: 后端 tns-mes-server (NodePort 31180) 统一提供前端页面与 API, 不再使用 Gateway/微服务/独立前端 Pod
# ==============================================================================
# 01-config-secrets.yaml
# TNS-MES Phase 3 高可用部署 - 全局配置与密钥
# 说明: 集中管理数据库连接、中间件地址、SAP 接口配置等
#       ConfigMap 存储非敏感配置项, Secret 存储 base64 编码的密码
# ==============================================================================

---
# ConfigMap: TNS-MES 全局应用配置
# 用途: 供微服务通过 envFrom / env 引用, 实现配置统一管理
apiVersion: v1
kind: ConfigMap
metadata:
  name: tns-mes-config
  namespace: tns-mes
  labels:
    app.kubernetes.io/part-of: tns-mes
    app.kubernetes.io/component: configuration
data:
  # --- 数据库 (SQL Server 2019) 配置 ---
  DB_URL: "jdbc:sqlserver://<DB_HOST>:1433;databaseName=tns_mes;encrypt=false;trustServerCertificate=true"
  DB_USERNAME: "<DB_USERNAME>"
  DB_PASSWORD: "<DB_PASSWORD>"

  # --- Nacos 配置中心/注册中心 ---
  NACOS_ADDR: "nacos-svc.tns-mes-middleware:8848"
  # Nacos 使用外部 SQL Server 存储配置数据
  NACOS_CONFIG_SERVER_ADDR: "<DB_HOST>:1433"

  # --- Redis 配置 ---
  REDIS_HOST: "redis-svc.tns-mes-middleware"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "<REDIS_PASSWORD>"

  # --- RocketMQ 配置 ---
  ROCKETMQ_NAMESERVER: "rocketmq-namesrv-svc.tns-mes-middleware:9876"

  # --- SAP S/4HANA 接口配置 ---
  SAP_BASE_URL: "https://my200725.s4hana.sapcloud.cn"
  SAP_USERNAME: "<SAP_USERNAME>"
  SAP_PASSWORD: "<SAP_PASSWORD>"

  # --- Sentinel 流控 Dashboard ---
  SENTINEL_DASHBOARD: "sentinel-dashboard.tns-mes-middleware:8080"

  # --- Seata 分布式事务 TC Server ---
  SEATA_ADDR: "seata-server.tns-mes-middleware:8091"

  # --- SkyWalking 链路追踪 OAP 地址 ---
  SKYWALKING_OAP: "skywalking-oap.tns-mes-observability:11800"

  # --- Spring 专用配置 ---
  SPRING_PROFILES_ACTIVE: "prod"

---
# Secret: TNS-MES 敏感凭证 (base64 编码)
# 用途: 供微服务通过 secretKeyRef 引用, 避免明文暴露密码
# 注意: 生产环境建议改用 Sealed Secrets / External Secrets / Vault 管理
apiVersion: v1
kind: Secret
metadata:
  name: tns-mes-secrets
  namespace: tns-mes
  labels:
    app.kubernetes.io/part-of: tns-mes
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # <DB_PASSWORD> -> base64 (replace before deploying)
  db-password: "REFUQV9QQVNTV09SRA=="
  # <REDIS_PASSWORD> -> base64 (replace before deploying)
  redis-password: "REFBVEFfUEFTU1dPUkQ="
  # <SAP_PASSWORD> -> base64 (replace before deploying)
  sap-password: "U0FQX1BBU1NXT1JE"
