# ==============================================================================
# 01-config-secrets.yaml
# TNS-MES 生产部署 - 全局配置与密钥 (无明文凭证)
# ==============================================================================
# ConfigMap: 非敏感配置 (地址/开关/URL)
# Secret: 敏感凭证 (base64 编码, 部署前替换)
# ==============================================================================

---
# ConfigMap: TNS-MES 全局应用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: tns-mes-config
  namespace: tns-mes
  labels:
    app.kubernetes.io/part-of: tns-mes
    app.kubernetes.io/component: configuration
data:
  # --- 数据库 (非敏感部分) ---
  MES_DB_URL: "jdbc:sqlserver://10.30.10.141:1433;databaseName=tns_mes;encrypt=false;trustServerCertificate=true"
  MES_DB_USERNAME: "tns_mes_user"

  # --- Redis (非敏感部分) ---
  REDIS_HOST: "redis-svc.tns-mes-middleware"
  REDIS_PORT: "6379"

  # --- SAP S/4HANA (URL 非敏感, 用户名非敏感) ---
  MES_SAP_BASE_URL: "https://my200725.s4hana.sapcloud.cn"
  MES_SAP_USERNAME: "MES_P"

  # --- 中间件地址 (非敏感) ---
  ROCKETMQ_NAMESERVER: "rocketmq-namesrv-svc.tns-mes-middleware:9876"
  NACOS_ADDR: "nacos-svc.tns-mes-middleware:8848"
  SENTINEL_DASHBOARD: "sentinel-dashboard.tns-mes-middleware:8080"
  SEATA_ADDR: "seata-server.tns-mes-middleware:8091"

  # --- 中间件功能开关 (默认关闭, 按需开启) ---
  MES_ROCKETMQ_ENABLED: "true"
  MES_SENTINEL_ENABLED: "true"
  MES_NACOS_ENABLED: "true"
  MES_SEATA_ENABLED: "true"
  MES_NACOS_USERNAME: "nacos"

  # --- SAP 同步开关 ---
  MES_SAP_SCHEDULE_ENABLED: "false"

  # --- Spring Profile ---
  SPRING_PROFILES_ACTIVE: "prod"

---
# Secret: TNS-MES 敏感凭证
# 部署前请替换为实际 base64 编码值:
#   echo -n 'actual_password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: tns-mes-secrets
  namespace: tns-mes
  labels:
    app.kubernetes.io/part-of: tns-mes
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # DB_PASSWORD: tns_mes_user 的密码
  db-password: "Q0hBTkdFX01FX0RCX1BBU1NXT1JE"
  # REDIS_PASSWORD: Redis 密码
  redis-password: "Q0hBTkdFX01FX1JFRElTX1BBU1NXT1JE"
  # SAP_PASSWORD: SAP API 密码 (SAP 同步默认关闭)
  sap-password: "Q0hBTkdFX01FX1NBUF9QQVNTV09SRA=="
  # JWT_SECRET: JWT 签名密钥 (≥32字节)
  jwt-secret: "VG5zTWVzMjAyNlByb2R1Y3Rpb25Kd3RTZWNyZXRLZXkzMkJ5dGVzIQ=="
  # ADMIN_PASSWORD: 初始管理员密码
  bootstrap-admin-password: "Q0hBTkdFX01FX0FETUlOX1BBU1NXT1JE"
  # Nacos 登录密码（部署前替换）
  nacos-password: "Q0hBTkdFX01FX05BQ09TX1BBU1NXT1JE"
