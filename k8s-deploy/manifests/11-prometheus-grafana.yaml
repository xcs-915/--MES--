# [架构说明] 当前为单体模式: 后端 tns-mes-server (NodePort 31180) 统一提供前端页面与 API, 不再使用 Gateway/微服务/独立前端 Pod
# ============================================================
# 11-prometheus-grafana.yaml - Prometheus + Grafana 监控部署清单
# 监控命名空间: tns-mes-observability
# 说明: Prometheus 抓取 K8s 集群 Pod 指标, Grafana 可视化展示
# 组件:
#   - prometheus: 抓取/存储时序指标 (端口 9090)
#   - grafana:    可视化仪表盘 (端口 3000, 默认 admin/Taiking@5563)
# 镜像版本:
#   - prom/prometheus:v2.45.0
#   - grafana/grafana:10.0.0
# ============================================================
---
# ============================================================
# 1. Prometheus 配置 ConfigMap
# 抓取策略: 自动发现并抓取 K8s 集群所有带 annotation 的 Pod
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tns-mes-observability
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    # 全局配置
    global:
      scrape_interval: 15s          # 抓取间隔 15 秒
      evaluation_interval: 15s      # 规则评估间隔 15 秒
      external_labels:
        cluster: tns-mes
        namespace: tns-mes

    # 告警规则文件
    rule_files:
      - /etc/prometheus/rules/*.yml

    # 抓取目标配置
    scrape_configs:
      # ---------- Prometheus 自监控 ----------
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # ---------- K8s Pod 自动发现 (抓取所有 pod metrics) ----------
      # 通过 K8s API 自动发现 Pod, 抓取 prometheus.io/scrape=true 的 Pod
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # 仅抓取带 prometheus.io/scrape=true annotation 的 Pod
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # 重写抓取地址为 Pod 的 prometheus.io/port annotation 指定端口
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # 注入命名空间标签
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          # 注入 Pod 名称标签
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          # 注入应用标签
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

      # ---------- K8s Service 自动发现 ----------
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      # ---------- SpringBoot 微服务 Actuator 指标 ----------
      - job_name: 'tns-mes-microservices'
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['tns-mes']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            action: keep
            regex: microservice|gateway
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:8080
            target_label: __address__

      # ---------- SkyWalking OAP 指标 ----------
      - job_name: 'skywalking-oap'
        static_configs:
          - targets: ['skywalking-oap.tns-mes-observability:12800']
            labels:
              service: skywalking-oap
---
# ============================================================
# 2. Prometheus Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: tns-mes-observability
  labels:
    app: prometheus
    component: monitoring
    tier: observability
    version: v2.45.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        component: monitoring
        tier: observability
        version: v2.45.0
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          # 资源限制: 768Mi / 250m
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          # 启动参数: 指定配置文件与存储路径
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus/data"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
          # 挂载配置文件
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus/data
          # 就绪探针
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # 存活探针
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
        # 数据持久化: emptyDir (生产建议替换为 PVC)
        - name: prometheus-data
          emptyDir: {}
      terminationGracePeriodSeconds: 60
---
# ---------- Prometheus Service (ClusterIP) ----------
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: tns-mes-observability
  labels:
    app: prometheus
    component: monitoring
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
---
# ---------- Prometheus ServiceAccount (访问 K8s API 发现 Pod) ----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: tns-mes-observability
  labels:
    app: prometheus
---
# ---------- Prometheus ClusterRole (集群级读取权限) ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app: prometheus
rules:
  # 读取 Pod / Service / Endpoint
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  # 读取 Ingress
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # 读取 ConfigMap (用于动态配置)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  # 非资源 URL (healthz 等)
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
# ---------- Prometheus ClusterRoleBinding ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: tns-mes-observability
---
# ============================================================
# 3. Grafana Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tns-mes-observability
  labels:
    app: grafana
    component: monitoring-ui
    tier: observability
    version: v10.0.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: monitoring-ui
        tier: observability
        version: v10.0.0
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # 资源限制: 256Mi / 100m
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            # 默认管理员账号: admin / Taiking@5563
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "Taiking@5563"
            - name: GF_SECURITY_ADMIN_PASSWORD_CONFIRM
              value: "Taiking@5563"
            # 允许匿名访问仪表盘 (可选)
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # 允许嵌入式
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: "http://grafana.tns-mes.local"
            # 数据源自动配置
            - name: GF_DATASOURCES_DEFAULT_DATA_SOURCE_NAME
              value: "Prometheus"
          # 数据源配置挂载
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: grafana-data
              mountPath: /var/lib/grafana
          # 就绪探针
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # 存活探针
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        # 数据源自动配置 ConfigMap
        - name: grafana-datasources
          configMap:
            name: grafana-datasources-config
            items:
              - key: datasources.yaml
                path: datasources.yaml
        # 数据持久化: emptyDir (生产建议替换为 PVC)
        - name: grafana-data
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
# ---------- Grafana 数据源配置 ConfigMap ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-config
  namespace: tns-mes-observability
  labels:
    app: grafana
    component: monitoring-ui
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Prometheus 数据源 (主数据源)
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-svc.tns-mes-observability:9090
        isDefault: true
        editable: true
      # SkyWalking 数据源 (链路追踪)
      - name: SkyWalking
        type: skywalking
        access: proxy
        url: http://skywalking-oap.tns-mes-observability:12800
        isDefault: false
        editable: true
---
# ---------- Grafana Service (ClusterIP) ----------
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: tns-mes-observability
  labels:
    app: grafana
    component: monitoring-ui
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
