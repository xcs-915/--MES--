# ==============================================================================
# 12-backend-deploy.yaml - TNS-MES 单体后端部署清单 (Monolithic Backend)
# ==============================================================================
# [架构说明] 当前为单体模式: 后端 tns-mes-server (NodePort 31180) 统一提供前端页面与 API, 不再使用 Gateway/微服务/独立前端 Pod
# --------------------------------------------------------------------------------
# 部署要点:
#   - 单体后端 tns-mes-server 同时承载前端页面与 REST API
#   - 2 副本高可用, 滚动更新保证零中断 (maxUnavailable: 0)
#   - 镜像 tns-mes-server:latest, 本地镜像 (imagePullPolicy: Never)
#   - 数据库/Redis/JWT/管理员/SAP 凭证通过 K8s Secret + envFrom 注入
#   - 中间件功能开关 (RocketMQ/Sentinel/Nacos/Seata) 默认关闭, 按需开启
#   - 三级探针: startup → readiness → liveness (避免慢启动误杀)
#   - Prometheus 监控注解: /tns-mes/actuator/prometheus
#   - 对外暴露: NodePort 31180, 集群内通过 tns-mes-backend-svc:8080 访问
# ==============================================================================
---
# ---------- 单体后端 Deployment ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tns-mes-backend
  namespace: tns-mes
  labels:
    app: tns-mes-backend
    component: backend
    tier: backend
    architecture: monolithic
    version: v2
  annotations:
    # Prometheus 监控: 由 Service Monitor 或 Pod 注解发现
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/tns-mes/actuator/prometheus"
spec:
  # 高可用: 2 副本
  replicas: 2
  # 滚动更新: 先启动新 Pod 再下旧 Pod, 保证零中断
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # 修订历史: 保留 5 个旧版本便于回滚
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: tns-mes-backend
  template:
    metadata:
      labels:
        app: tns-mes-backend
        component: backend
        tier: backend
        architecture: monolithic
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/tns-mes/actuator/prometheus"
    spec:
      initContainers:
        - name: skywalking-agent
          image: apache/skywalking-java-agent:9.3.0-java17
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - cp -R /skywalking/agent/* /opt/skywalking/
          volumeMounts:
            - name: skywalking-agent
              mountPath: /opt/skywalking
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "128Mi"
      containers:
        - name: tns-mes-server
          # 本地构建镜像, 不从远程仓库拉取
          image: tns-mes-server:v30
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # 资源限制: 请求 512Mi/500m, 限制 2048Mi/2000m
          # 单体后端需要足够内存应对 SAP OData 解析 + Redis 缓存 + Flyway 迁移
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          envFrom:
            # 统一引用 ConfigMap 中所有非敏感配置 (DB URL, Redis, SAP, 中间件开关等)
            - configMapRef:
                name: tns-mes-config
          env:
            # ---------- Spring 环境 ----------
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            # ---------- 数据库凭证 (Secret) ----------
            - name: MES_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tns-mes-secrets
                  key: db-password
            # ---------- Redis 密码 (Secret) ----------
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tns-mes-secrets
                  key: redis-password
            # ---------- Spring Boot Redis Relaxed Binding ----------
            # 直接通过环境变量设置 Spring 属性, 不依赖 YAML 占位符解析
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-svc.tns-mes-middleware"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tns-mes-secrets
                  key: redis-password
            - name: SPRING_DATA_REDIS_TIMEOUT
              value: "3s"
            - name: SPRING_DATA_REDIS_CONNECT_TIMEOUT
              value: "3s"
            - name: SPRING_DATA_REDIS_CLUSTER_NODES
              value: "redis-node-0.redis-headless.tns-mes-middleware.svc.cluster.local:6379,redis-node-1.redis-headless.tns-mes-middleware.svc.cluster.local:6379,redis-node-2.redis-headless.tns-mes-middleware.svc.cluster.local:6379,redis-node-3.redis-headless.tns-mes-middleware.svc.cluster.local:6379,redis-node-4.redis-headless.tns-mes-middleware.svc.cluster.local:6379,redis-node-5.redis-headless.tns-mes-middleware.svc.cluster.local:6379"
            - name: SPRING_DATA_REDIS_CLUSTER_MAX_REDIRECTS
              value: "5"
            # 旧式兼容 (spring.redis.* → spring.data.redis.*)
            - name: SPRING_REDIS_HOST
              value: "redis-svc.tns-mes-middleware"
            - name: SPRING_REDIS_PORT
              value: "6379"
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tns-mes-secrets
                  key: redis-password
            # ---------- JWT 密钥与管理员账号 (Secret) ----------
            - name: MES_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tns-mes-secrets
                  key: jwt-secret
            - name: MES_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tns-mes-secrets
                  key: bootstrap-admin-password
            # ---------- SAP S/4HANA 密码 (Secret) ----------
            - name: MES_SAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tns-mes-secrets
                  key: sap-password
            - name: MES_NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tns-mes-secrets
                  key: nacos-password
            # ---------- SkyWalking Java Agent ----------
            - name: SW_AGENT_NAME
              value: "tns-mes-server"
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: "skywalking-oap.tns-mes-observability:11800"
            # ---------- JVM 参数 (优化容器内存) ----------
            - name: JAVA_OPTS
              value: >-
                -javaagent:/opt/skywalking/skywalking-agent.jar
                -XX:+UseG1GC
                -XX:MaxRAMPercentage=75
                -XX:InitialRAMPercentage=50
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/tmp/heapdump
                -Dfile.encoding=UTF-8
                -Duser.timezone=UTC
                -Dserver.tomcat.max-threads=200
                -Dserver.tomcat.accept-count=100
            - name: JAVA_TOOL_OPTIONS
              value: "-Dcsp.sentinel.log.dir=/tmp"
          # 启动探针: 给 Spring Boot 足够启动时间 (Flyway 迁移 + Bean 初始化)
          # 失败前允许 300 秒 (30 次 × 10 秒)
          startupProbe:
            httpGet:
              path: /tns-mes/actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # 就绪探针: 启动后每 10 秒检查, 3 次失败标记为不就绪
          readinessProbe:
            httpGet:
              path: /tns-mes/actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # 存活探针: 每 20 秒检查, 5 次失败重启 Pod
          livenessProbe:
            httpGet:
              path: /tns-mes/actuator/health
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          # 优雅终止: 给后端 60 秒处理在途请求并下线
          # 安全上下文: 非 root 用户运行
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: skywalking-agent
              mountPath: /opt/skywalking
              readOnly: true
      # 优雅终止: 给后端 60 秒处理在途请求并下线
      terminationGracePeriodSeconds: 60
      volumes:
        - name: skywalking-agent
          emptyDir: {}
      # 亲和性: 两个副本尽量调度到不同节点
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: tns-mes-backend
                topologyKey: kubernetes.io/hostname
---
# ---------- 单体后端 Service (NodePort 31180) ----------
apiVersion: v1
kind: Service
metadata:
  name: tns-mes-backend-svc
  namespace: tns-mes
  labels:
    app: tns-mes-backend
    component: backend
    architecture: monolithic
spec:
  type: NodePort
  selector:
    app: tns-mes-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31180
      protocol: TCP
---
# ---------- 单体后端 PodDisruptionBudget ----------
# 用途: 维护/驱逐期间保证至少 1 个副本可用
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tns-mes-backend-pdb
  namespace: tns-mes
  labels:
    app: tns-mes-backend
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tns-mes-backend
---
# ---------- HPA: 自动伸缩 (基于 CPU 利用率) ----------
# 当 CPU 平均利用率超过 80% 时自动扩容 (最多 4 副本)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tns-mes-backend-hpa
  namespace: tns-mes
  labels:
    app: tns-mes-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tns-mes-backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
