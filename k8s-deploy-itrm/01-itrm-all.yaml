apiVersion: v1
kind: Namespace
metadata:
  name: itrm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: itrm-config
  namespace: itrm
data:
  application.yml: |
    server:
      port: 8081
      servlet:
        context-path: /itrm
    spring:
      application:
        name: itrm-platform
      datasource:
        url: jdbc:sqlserver://10.30.10.141:1433;databaseName=TNS_MES;encrypt=false;trustServerCertificate=true
        username: sa
        driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.SQLServer2016Dialect
      flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: false
        baseline-version: 0
        default-schema: dbo
        table: itrm_flyway_schema_history
    app:
      jwt:
        secret: itrm-platform-secret-key-please-change-in-production
        expiration: 86400000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itrm-backend
  namespace: itrm
  labels:
    app: itrm-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: itrm-backend
  template:
    metadata:
      labels:
        app: itrm-backend
    spec:
      containers:
        - name: itrm-platform
          image: itrm-platform:v8
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itrm-secrets
                  key: db-password
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /itrm/actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /itrm/actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: itrm-backend-svc
  namespace: itrm
spec:
  type: NodePort
  selector:
    app: itrm-backend
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 31181
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: itrm-backend-pdb
  namespace: itrm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: itrm-backend
