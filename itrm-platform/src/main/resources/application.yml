server:
  port: 8081
  servlet:
    context-path: /itrm

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  application:
    name: itrm-platform
  datasource:
    url: jdbc:sqlserver://10.30.10.141:1433;databaseName=TNS_MES;encrypt=false;trustServerCertificate=true
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2016Dialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 0
    default-schema: dbo
    table: itrm_flyway_schema_history

app:
  jwt:
    secret: ${APP_JWT_SECRET:itrm-platform-local-development-secret-key}
    expiration: 86400000
  default-admin:
    username: admin
    password: admin123

integration:
  wecom:
    webhook: ${WECOM_WEBHOOK_URL:}
