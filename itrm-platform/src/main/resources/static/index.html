<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT需求管理平台</title>
  <link rel="stylesheet" href="/itrm/app.css?v=1">
</head>
<body>
  <div id="login-view" class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">IT</div>
        <div class="logo-text">
          <h1>ITRM Platform</h1>
          <p>IT 需求管理与开发进度跟踪平台</p>
        </div>
      </div>
      <div class="login-form">
        <label><span>用户名</span><input id="login-username" type="text" placeholder="admin" value="admin"></label>
        <label><span>密码</span><input id="login-password" type="password" placeholder="admin123" value="admin123"></label>
        <button id="login-btn" class="btn-primary">登 录</button>
        <p class="login-tip">默认账号：admin / admin123</p>
      </div>
    </div>
  </div>

  <div id="app-view" class="app-wrap hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon small">IT</div>
        <div>
          <div class="brand">ITRM</div>
          <div class="brand-sub">需求管理平台</div>
        </div>
      </div>
      <nav class="nav-menu">
        <a class="nav-link active" data-view="dashboard">
          <svg class="icon"><use href="#icon-dashboard"></use></svg><span>工作台</span>
        </a>
        <a class="nav-link" data-view="requirements">
          <svg class="icon"><use href="#icon-clipboard"></use></svg><span>需求池</span>
        </a>
        <a class="nav-link" data-view="tasks">
          <svg class="icon"><use href="#icon-list"></use></svg><span>任务管理</span>
        </a>
        <a class="nav-link" data-view="board">
          <svg class="icon"><use href="#icon-board"></use></svg><span>项目看板</span>
        </a>
        <a class="nav-link" data-view="testing">
          <svg class="icon"><use href="#icon-check"></use></svg><span>测试验收</span>
        </a>
        <a class="nav-link" data-view="timelog">
          <svg class="icon"><use href="#icon-clock"></use></svg><span>工时管理</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar" id="user-avatar">A</div>
          <div>
            <div class="user-name" id="user-name">admin</div>
            <div class="user-role" id="user-role">管理员</div>
          </div>
        </div>
        <button class="logout-btn" id="logout-btn">退出</button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb">工作台</div>
        <div class="topbar-actions">
        </div>
      </header>
      <div id="page" class="page-container"></div>
    </main>
  </div>

  <!-- SVG Icons -->
  <svg style="display:none">
    <symbol id="icon-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/>
      <rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
    </symbol>
    <symbol id="icon-clipboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
      <rect x="8" y="2" width="8" height="4" rx="1"/>
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
      <circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>
    </symbol>
    <symbol id="icon-board" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
    </symbol>
  </svg>

  <script type="module" src="/itrm/src/main.js?v=1"></script>
</body>
</html>
